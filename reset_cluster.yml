---
# Kubernetes Cluster Reset Playbook
# Usage: ansible-playbook -i inventory.ini reset_cluster.yml

- name: Reset Kubernetes Cluster
  hosts: all
  become: yes
  serial: 1  # Reset one node at a time for safety
  roles:
    - { role: reset_k8s_cluster, tags: ['reset', 'cleanup'] }

# Optional: Clean up Rook-Ceph OS remnants AFTER cluster reset
# (disk wipe + directory cleanup, no K8s API required)
- name: Cleanup Rook-Ceph Storage (post-reset)
  hosts: all
  become: yes
  roles:
    - role: cleanup_rook_ceph
      tags: ['cleanup-rook-ceph']
      when: enable_rook_ceph_cleanup | default(false)

# Optional: Reboot nodes after reset
- name: Reboot nodes after reset (optional)
  hosts: all
  become: yes
  tasks:
    - name: Reboot system
      reboot:
        reboot_timeout: 600
      when: reboot_after_reset | default(false)
  tags: ['reboot']
