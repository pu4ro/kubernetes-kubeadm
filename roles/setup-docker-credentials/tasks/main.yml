---
- name: Ensure /var/lib/kubelet directory exists
  file:
    path: /var/lib/kubelet
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - docker-credentials

- name: Get installed containerd version for credential setup
  shell: containerd --version | awk '{print $3}' | sed 's/v//'
  register: containerd_version_for_creds
  changed_when: false
  when: docker_registries is defined
  tags:
    - docker-credentials

- name: Set containerd major.minor version for credential setup
  set_fact:
    containerd_major_minor_creds: "{{ containerd_version_for_creds.stdout.split('.')[:2] | join('.') }}"
  when: docker_registries is defined
  tags:
    - docker-credentials

- name: Deploy containerd configuration (version < 2.2) for credential setup
  template:
    src: "{{ playbook_dir }}/roles/install_containerd/templates/config_v2.toml.j2"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    backup: yes
  register: containerd_config_v2
  when:
    - docker_registries is defined
    - containerd_major_minor_creds is version('2.2', '<')
  tags:
    - docker-credentials
    - containerd-restore

- name: Deploy containerd configuration (version >= 2.2) for credential setup
  template:
    src: "{{ playbook_dir }}/roles/install_containerd/templates/config_v3.toml.j2"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    backup: yes
  register: containerd_config_v3
  when:
    - docker_registries is defined
    - containerd_major_minor_creds is version('2.2', '>=')
  tags:
    - docker-credentials
    - containerd-restore

- name: Restart containerd service
  systemd:
    name: containerd
    state: restarted
    daemon_reload: yes
  when:
    - docker_registries is defined
    - containerd_config_v2 is changed or containerd_config_v3 is changed
  tags:
    - docker-credentials
    - restart-containerd

- name: Check if kubelet service exists
  stat:
    path: /usr/lib/systemd/system/kubelet.service
  register: kubelet_service_file
  tags:
    - docker-credentials

- name: Check if kubelet directory exists
  stat:
    path: /var/lib/kubelet
  register: kubelet_directory
  tags:
    - docker-credentials

- name: Deploy kubelet image-pull credentials (config.json)
  template:
    src: kubelet-config.json.j2
    dest: /var/lib/kubelet/config.json
    owner: root
    group: root
    mode: '0600'
  register: kubelet_config_copy
  no_log: true
  when:
    - docker_registries is defined
    - kubelet_directory.stat.exists
  tags:
    - docker-credentials

- name: Restart kubelet service
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes
  when:
    - kubelet_service_file.stat.exists
    - kubelet_config_copy is changed
  tags:
    - docker-credentials
    - restart-kubelet